[workspace]
members = [
  "crates/tapestry-core",
  "crates/tapestry-input",
  "crates/tapestry-analyzer",
  "crates/tapestry-runtime",
  "crates/tapestry-cli"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
url = "2"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
